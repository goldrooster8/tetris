<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>21 - Multiplayer Card Game</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#10131a;color:#fff}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#lobby{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#202b40,#0d1016)
}
.lobby-box{
  width:min(500px,92vw);padding:30px;background:#181e29;border:1px solid #3b4659;
  border-radius:18px;box-shadow:0 20px 60px #0008
}
h1{margin:0 0 8px;font-size:48px}
.lobby-box p{color:#aab4c5}
input{
  width:100%;padding:12px;margin:6px 0 12px;border-radius:8px;
  border:1px solid #455168;background:#0d121b;color:#fff
}
button{
  border:1px solid #52617a;background:#26334a;color:white;border-radius:8px;
  padding:11px 15px
}
button:hover:not(:disabled){background:#34445f}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:#3159a5}
.danger{background:#722f35}
#lobbyStatus{min-height:24px;color:#aeb8c9;margin-top:12px}

#game{
  width:100%;height:100%;position:relative;
  background:radial-gradient(circle at center,#24344e,#0c1017 70%)
}

#topbar{
  position:absolute;top:0;left:0;right:0;height:60px;z-index:100;
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  background:#080b11dd;border-bottom:1px solid #384457
}
.brand{font-size:22px;font-weight:bold}
.room{color:#aeb8c9;font-size:13px}
.top-buttons{display:flex;gap:8px}

#table{
  position:absolute;top:60px;left:0;right:0;bottom:0;overflow:hidden
}
#tableSurface{
  position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
  width:min(85vw,1000px);height:min(72vh,680px);border-radius:50%;
  background:radial-gradient(ellipse,#2b3d59,#16263d 70%);
  border:2px solid #405775;
  box-shadow:inset 0 0 80px #0005,0 25px 80px #0007
}

#turnBanner{
  position:absolute;top:72px;left:50%;transform:translateX(-50%);
  z-index:90;background:#3159a5;padding:10px 20px;border-radius:20px;
  font-weight:bold;opacity:0;transition:.2s
}
#turnBanner.show{opacity:1}

#turnInfo{
  position:absolute;top:75px;right:18px;z-index:80;
  background:#080b11dd;border:1px solid #46536a;border-radius:10px;
  padding:10px 16px;text-align:center
}
#timer{font-size:28px;font-weight:bold}
#timerLabel{font-size:10px;color:#9ca8ba}

#middleArea{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(70vw,750px);display:flex;flex-direction:column;align-items:center;
  z-index:30
}
.sum{
  background:#080b11dd;border:1px solid #53627a;border-radius:20px;
  padding:8px 15px;font-weight:bold
}
#middleCards{
  margin-top:12px;display:flex;flex-wrap:wrap;justify-content:center;
  gap:6px;max-width:100%
}
#middleHint{font-size:11px;color:#aab4c5;margin-top:7px}

.card{
  width:68px;height:94px;border-radius:10px;border:2px solid #ffffff44;
  position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:#10131a;box-shadow:0 7px 15px #0006;
  flex-shrink:0;user-select:none
}
.card.red{background:#e95e62}
.card.blue{background:#5b91e7}
.card.green{background:#55c788}
.card.yellow{background:#e6c94b}
.card .value{font-size:33px;font-weight:900}
.card .special{
  margin-top:6px;background:#ffffff99;border-radius:4px;
  padding:3px 5px;font-size:8px;font-weight:900
}
.card .dot{
  position:absolute;top:5px;right:6px;width:7px;height:7px;
  border-radius:50%;background:#0005
}
.back{
  background:linear-gradient(135deg,#26344b,#111823)!important;
  color:#fff!important;border-color:#657895!important
}
.back .question{font-size:30px;font-weight:bold}
.back .count{position:absolute;bottom:5px;font-size:9px;color:#c5d0e1}

#players{position:absolute;inset:0;z-index:25;pointer-events:none}
.player{
  position:absolute;transform:translate(-50%,-50%);width:155px
}
.player-box{
  background:#080b11dd;border:1px solid #46536a;border-radius:12px;
  padding:8px;text-align:center
}
.player-box.active{border-color:#79a2ff;box-shadow:0 0 0 3px #79a2ff22}
.player-box.local{border-color:#6bd49c}
.player-name{font-weight:bold;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-meta{font-size:10px;color:#aab4c5;margin-top:3px}
.opponent-cards{display:flex;justify-content:center;margin-top:5px}
.opponent-cards .card{width:28px;height:39px;margin-left:-10px}
.opponent-cards .card:first-child{margin-left:0}
.opponent-cards .question{font-size:14px}
.opponent-cards .count{display:none}

#localPanel{
  position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  width:min(950px,96vw);z-index:80;
  display:grid;grid-template-columns:120px 1fr 125px;gap:10px;align-items:end
}
.panel{
  background:#080b11dd;border:1px solid #46536a;border-radius:13px;
  padding:9px
}
#drawArea{text-align:center}
#drawArea small,#handHeader small{color:#aab4c5}
#drawDeck{margin:7px auto 0;width:78px}
#drawDeck .card{width:78px;height:106px}
#handHeader{display:flex;justify-content:space-between;margin-bottom:5px}
#handCards{display:flex;gap:6px;overflow-x:auto;padding:3px}
#handCards .card{cursor:pointer}
#handCards .card:hover{transform:translateY(-5px)}
#handCards .card.disabled{opacity:.4;cursor:not-allowed}
#actions{display:flex;flex-direction:column;gap:7px}

#overlay{
  position:absolute;inset:0;z-index:200;background:#05070bcc;
  display:flex;align-items:center;justify-content:center
}
.overlay-box{
  width:min(430px,90vw);padding:30px;text-align:center;
  background:#171d29;border:1px solid #4a5870;border-radius:18px;
  box-shadow:0 25px 70px #000b
}
.overlay-box h2{font-size:48px;margin:0 0 10px}
.overlay-box p{color:#aeb8c9}

#choiceModal{
  position:absolute;inset:0;z-index:180;background:#0008;
  display:flex;align-items:center;justify-content:center
}
.choice-box{
  width:min(500px,90vw);max-height:80vh;overflow:auto;
  background:#171d29;border:1px solid #4b5970;border-radius:15px;padding:20px
}
.choice-options{display:grid;gap:8px;margin-top:15px}
.choice-option{text-align:left}
.choice-option strong{display:block}
.choice-option small{color:#aeb8c9}

#toast{
  position:absolute;bottom:175px;left:50%;transform:translateX(-50%);
  z-index:300;background:#080b11ee;border:1px solid #52617a;
  border-radius:8px;padding:10px 16px;opacity:0;pointer-events:none;
  transition:.2s
}
#toast.show{opacity:1}

@media(max-width:800px){
  #localPanel{grid-template-columns:90px 1fr}
  #actions{grid-column:1/-1;flex-direction:row}
  #actions button{flex:1}
  .card{width:56px;height:78px}
  .card .value{font-size:27px}
  #drawDeck .card{width:65px;height:90px}
}
</style>
</head>

<body>

<div id="app">

<section id="lobby">
  <div class="lobby-box">
    <h1>21</h1>
    <p>Survive as long as possible without going above 21.</p>

    <label>Player Name</label>
    <input id="playerName" maxlength="18" placeholder="Your name">

    <label>Room Code</label>
    <input id="roomCode" maxlength="6" placeholder="Leave blank to create a room">

    <div style="display:flex;gap:8px">
      <button id="createRoomBtn" class="primary">Create Room</button>
      <button id="joinRoomBtn">Join Room</button>
    </div>

    <div id="lobbyStatus"></div>
  </div>
</section>

<section id="game" class="hidden">

  <div id="topbar">
    <div>
      <span class="brand">21</span>
      <span class="room">Room: <strong id="roomCodeDisplay">----</strong></span>
    </div>

    <div class="top-buttons">
      <button id="copyRoomBtn">Copy Code</button>
      <button id="leaveBtn" class="danger">Leave</button>
    </div>
  </div>

  <div id="turnBanner">YOUR TURN</div>

  <div id="turnInfo">
    <div id="timer">30</div>
    <div id="timerLabel">TURN TIMER</div>
  </div>

  <div id="table">
    <div id="tableSurface"></div>
    <div id="players"></div>

    <div id="middleArea">
      <div class="sum">
        MIDDLE: <span id="middleSum">0</span> / 21
      </div>

      <div id="middleCards"></div>
      <div id="middleHint"></div>
    </div>

    <div id="localPanel">

      <div id="drawArea" class="panel">
        <small>DRAW</small>
        <div id="drawDeck">
          <div class="card back">
            <div class="question">?</div>
          </div>
        </div>
      </div>

      <div id="handArea" class="panel">
        <div id="handHeader">
          <strong>Your Hand</strong>
          <small>SUM: <span id="handSum">0</span> / 21</small>
        </div>
        <div id="handCards"></div>
      </div>

      <div id="actions">
        <button id="startBtn" class="primary hidden">Start Game</button>
        <button id="cancelActionBtn" class="hidden">Cancel</button>
      </div>

    </div>
  </div>

  <div id="choiceModal" class="hidden">
    <div class="choice-box">
      <h2 id="choiceTitle">Choose</h2>
      <p id="choiceDescription"></p>
      <div id="choiceOptions" class="choice-options"></div>
      <button id="closeChoiceBtn" style="margin-top:12px">Cancel</button>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div class="overlay-box">
      <h2 id="resultTitle">GAME OVER</h2>
      <p id="resultText"></p>
      <button id="overlayLeaveBtn" class="primary">Return to Lobby</button>
    </div>
  </div>

  <div id="toast"></div>

</section>
</div>

<script type="module">

// Import the functions you need from the SDKs you need
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  getDatabase,
  ref,
  set,
  get,
  update,
  onValue,
  runTransaction,
  onDisconnect,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBfOKGz06urUqutCnDUfy6P2hMswoBifq8",
  authDomain: "bomb-game-782c2.firebaseapp.com",
  databaseURL: "https://bomb-game-782c2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bomb-game-782c2",
  storageBucket: "bomb-game-782c2.firebasestorage.app",
  messagingSenderId: "984947565972",
  appId: "1:984947565972:web:486661db2f7dab317bdb81"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const $ = id => document.getElementById(id);

const COLORS = ["red","blue","green","yellow"];

const SPECIALS = {
  discard: { value:3, label:"DISCARD" },
  add:     { value:5, label:"ADD" },
  twoone:  { value:3, label:"2-1" },
  evil4:   { value:4, label:"EVIL 4" },
  switch:  { value:8, label:"SWITCH" }
};

const MAX_PLAYERS = 6;
const MIN_PLAYERS = 2;
const STARTING_HAND = 3;
const TURN_TIME = 30000;

let uid = null;
let roomCode = null;
let roomState = null;
let roomUnsubscribe = null;
let serverOffset = 0;
let toastTimer = null;

let pendingAction = null;
let pendingDiscardCard = null;

let authReadyResolve;
const authReady = new Promise(resolve => {
  authReadyResolve = resolve;
});

/* ============================================================
   AUTH
============================================================ */

onAuthStateChanged(auth, user => {
  if (user) {
    uid = user.uid;
    authReadyResolve();
  }
});

signInAnonymously(auth).catch(error => {
  setLobbyStatus("Firebase authentication failed: " + error.message, true);
});

onValue(ref(db, ".info/serverTimeOffset"), snap => {
  serverOffset = Number(snap.val() || 0);
});

function serverNow() {
  return Date.now() + serverOffset;
}

/* ============================================================
   CARD ENGINE
============================================================ */

function randomColor() {
  return COLORS[Math.floor(Math.random() * COLORS.length)];
}

function randomNormalValue() {

  const r = Math.random();

  if (r < 0.10) {
    return 0;
  }

  if (r < 0.80) {
    return 1 + Math.floor(Math.random() * 8);
  }

  return 9 + Math.floor(Math.random() * 4);
}

function randomSpecialType() {
  const types = Object.keys(SPECIALS);
  return types[Math.floor(Math.random() * types.length)];
}

function createCard() {

  const color = randomColor();

  if (Math.random() < 0.75) {

    return {
      id: crypto.randomUUID(),
      color,
      kind: "normal",
      value: randomNormalValue()
    };

  }

  const kind = randomSpecialType();

  return {
    id: crypto.randomUUID(),
    color,
    kind,
    value: SPECIALS[kind].value
  };
}

function createDeck(size = 180) {
  const deck = [];

  for (let i = 0; i < size; i++) {
    deck.push(createCard());
  }

  return deck;
}

/* ============================================================
   BASIC HELPERS
============================================================ */

function playersArray(state) {
  return Object.values(state.players || {})
    .sort((a,b) => (a.seat || 0) - (b.seat || 0));
}

function getPlayer(state, playerUid) {
  return state.players?.[playerUid] || null;
}

function localPlayer(state) {
  return getPlayer(state, uid);
}

function cardValue(card) {
  return Number(card?.value || 0);
}

function handSum(player) {
  return (player.hand || []).reduce((sum, card) => sum + cardValue(card), 0);
}

function middleSum(state) {
  return (state.middle || []).reduce((sum, card) => sum + cardValue(card), 0);
}

function isMyTurn(state) {
  return state.status === "playing" &&
         state.currentPlayerUid === uid &&
         !state.loserUid;
}

function nextPlayerUid(state, currentUid) {

  const players = playersArray(state);

  if (!players.length) return null;

  const index = players.findIndex(p => p.uid === currentUid);

  if (index === -1) return players[0].uid;

  return players[(index + 1) % players.length].uid;
}

function drawFromState(state) {

  if (!state.drawPile || !state.drawPile.length) {
    state.drawPile = createDeck();
  }

  return state.drawPile.pop();
}

function clone(value) {
  return JSON.parse(JSON.stringify(value));
}

/* ============================================================
   FLUSH
============================================================ */

function evil4Active(state) {
  return (state.middle || []).some(card => card.kind === "evil4");
}

function resolveFlush(state) {

  const required = evil4Active(state) ? 4 : 3;

  const colors = {};

  for (const card of state.middle || []) {
    colors[card.color] = (colors[card.color] || 0) + 1;
  }

  const matchingColor = Object.keys(colors)
    .find(color => colors[color] >= required);

  if (!matchingColor) return false;

  const indexes = [];

  for (let i = 0; i < state.middle.length; i++) {

    if (state.middle[i].color === matchingColor) {
      indexes.push(i);

      if (indexes.length === required) break;
    }
  }

  state.middle = state.middle.filter(
    (_, index) => !indexes.includes(index)
  );

  return true;
}

/* ============================================================
   LEGAL CARD PLAY
============================================================ */

function cardCanEnterMiddle(state, card, extraRemoval = null) {

  let sum = middleSum(state);

  if (extraRemoval) {
    sum -= cardValue(extraRemoval);
  }

  return sum + cardValue(card) <= 21;
}

function clutchPlayable(state, player) {

  const currentMiddle = middleSum(state);

  return (player.hand || []).filter(card => {

    /*
      Playing a normal/special card removes it from the hand,
      therefore the player's new sum must be <= 21.
    */

    const newHandSum = handSum(player) - cardValue(card);

    if (newHandSum > 21) return false;

    if (card.kind === "discard") {

      return (state.middle || []).some(target => {
        return currentMiddle - cardValue(target) + card.value <= 21;
      });

    }

    return currentMiddle + cardValue(card) <= 21;
  });
}

function normalPlayable(state, player) {

  if (player.clutch) {
    return clutchPlayable(state, player);
  }

  return (player.hand || []).filter(card => {

    if (card.kind === "discard") {

      return (state.middle || []).some(target => {
        return middleSum(state) - cardValue(target) + card.value <= 21;
      });

    }

    if (card.kind === "switch") {
      return middleSum(state) + card.value <= 21;
    }

    if (card.kind === "twoone") {
      return middleSum(state) + card.value <= 21;
    }

    return middleSum(state) + card.value <= 21;
  });
}

/* ============================================================
   TURN ADVANCEMENT
============================================================ */

function advanceTurn(state) {

  state.currentPlayerUid =
    nextPlayerUid(state, state.currentPlayerUid);

  state.turnStartedAt = serverNow();
  state.turnEndsAt = serverNow() + TURN_TIME;
}

/* ============================================================
   GAME OVER
============================================================ */

function endGame(state, loserUid, reason) {

  state.status = "gameover";
  state.loserUid = loserUid;
  state.gameOverReason = reason;
  state.currentPlayerUid = null;
  state.turnStartedAt = null;
  state.turnEndsAt = null;
}

/* ============================================================
   SPECIAL: DISCARD
============================================================ */

function playDiscardCard(state, player, card, targetId) {

  const targetIndex =
    state.middle.findIndex(c => c.id === targetId);

  if (targetIndex === -1) {
    return { ok:false, error:"That middle card no longer exists." };
  }

  const target = state.middle[targetIndex];

  const newMiddleSum =
    middleSum(state) -
    cardValue(target) +
    card.value;

  if (newMiddleSum > 21) {
    return { ok:false, error:"That discard would make the middle pile exceed 21." };
  }

  state.middle.splice(targetIndex, 1);

  player.hand = player.hand.filter(c => c.id !== card.id);

  state.middle.push(card);

  return { ok:true };
}

/* ============================================================
   SPECIAL: SWITCH
============================================================ */

function playSwitch(state, player, card, targetUid) {

  if (!targetUid || targetUid === player.uid) {
    return { ok:false, error:"Choose another player." };
  }

  const target = getPlayer(state, targetUid);

  if (!target) {
    return { ok:false, error:"Player not found." };
  }

  if (middleSum(state) + card.value > 21) {
    return { ok:false, error:"The Switch card would bust the middle pile." };
  }

  const temp = player.hand;

  player.hand = target.hand;
  target.hand = temp;

  player.clutch = handSum(player) > 21;
  target.clutch = handSum(target) > 21;

  player.hand = player.hand.filter(c => c.id !== card.id);

  state.middle.push(card);

  return { ok:true };
}

/* ============================================================
   SPECIAL: 2-1
============================================================ */

function playTwoOne(state, player, card, mode) {

  if (middleSum(state) + card.value > 21) {
    return { ok:false, error:"The 2-1 card cannot enter the middle pile." };
  }

  player.hand = player.hand.filter(c => c.id !== card.id);

  state.middle.push(card);

  if (mode === "draw2discard1") {

    player.hand.push(drawFromState(state));
    player.hand.push(drawFromState(state));

    return { ok:true, discardCount:1 };
  }

  if (mode === "draw1discard2") {

    player.hand.push(drawFromState(state));

    return { ok:true, discardCount:2 };
  }

  return { ok:false, error:"Invalid 2-1 mode." };
}

/* ============================================================
   NORMAL PLAY
============================================================ */

function playNormalCard(state, player, card) {

  if (middleSum(state) + card.value > 21) {
    return { ok:false, error:"That card would make the middle pile exceed 21." };
  }

  player.hand = player.hand.filter(c => c.id !== card.id);

  state.middle.push(card);

  return { ok:true };
}

/* ============================================================
   COMPLETE ACTION
============================================================ */

function finishAction(state) {

  resolveFlush(state);

  const player = getPlayer(state, state.currentPlayerUid);

  /*
    A clutch is considered resolved once the hand is back
    at or below 21.
  */

  if (player && handSum(player) <= 21) {
    player.clutch = false;
  }

  /*
    If the current player still has no playable cards while
    their hand is <=21, they must draw.
  */

  if (
    state.status === "playing" &&
    player &&
    !player.clutch
  ) {

    const playable = normalPlayable(state, player);

    if (!playable.length) {
      player.hand.push(drawFromState(state));

      if (handSum(player) > 21) {
        player.clutch = true;
      }
    }
  }

  if (state.status === "playing") {
    advanceTurn(state);
  }
}

/* ============================================================
   MAIN TRANSACTION
============================================================ */

async function performAction(action) {

  if (!roomCode || !uid) return;

  const room = ref(db, "rooms/" + roomCode);

  try {

    const result = await runTransaction(room, state => {

      if (!state) return;

      if (state.status !== "playing") return;

      if (state.currentPlayerUid !== uid) return;

      const player = getPlayer(state, uid);

      if (!player) return;

      /*
        Resolve Add cards before the main action.
      */

      const addCount = (state.middle || [])
        .filter(c => c.kind === "add")
        .length;

      if (!state._addResolvedForTurn) {

        state._addResolvedForTurn = true;

        for (let i = 0; i < addCount; i++) {

          player.hand.push(drawFromState(state));

          /*
            IMPORTANT:
            Add-triggered draw above 21 = immediate loss.
          */

          if (handSum(player) > 21) {
            endGame(
              state,
              uid,
              "An Add card forced a draw that pushed your hand above 21."
            );

            return state;
          }
        }
      }

      /*
        If Add draws did not bust, continue with the
        player's normal turn.
      */

      if (action.type === "draw") {

        if (player.clutch) return;

        player.hand.push(drawFromState(state));

        if (handSum(player) > 21) {
          player.clutch = true;
        }

        state.lastAction =
          player.name + " drew a card.";

        finishAction(state);

        state._addResolvedForTurn = false;

        return state;
      }

      if (action.type === "play") {

        const cardIndex =
          player.hand.findIndex(c => c.id === action.cardId);

        if (cardIndex === -1) return;

        const card = player.hand[cardIndex];

        if (
          player.clutch &&
          !clutchPlayable(state, player).some(c => c.id === card.id)
        ) {
          return;
        }

        if (card.kind === "discard") {

          if (!action.targetId) return;

          const result =
            playDiscardCard(
              state,
              player,
              card,
              action.targetId
            );

          if (!result.ok) return;

          state.lastAction =
            player.name + " played DISCARD.";

        }

        else if (card.kind === "switch") {

          const result =
            playSwitch(
              state,
              player,
              card,
              action.targetUid
            );

          if (!result.ok) return;

          state.lastAction =
            player.name + " played SWITCH.";

        }

        else if (card.kind === "twoone") {

          const result =
            playTwoOne(
              state,
              player,
              card,
              action.mode
            );

          if (!result.ok) return;

          /*
            2-1's discard step is completed by the client
            using a second transaction.
          */

          state.pendingDiscard = {
            uid: uid,
            count: result.discardCount
          };

          state.lastAction =
            player.name + " played 2-1.";

          resolveFlush(state);

          state._addResolvedForTurn = false;

          return state;
        }

        else {

          const result =
            playNormalCard(state, player, card);

          if (!result.ok) return;

          state.lastAction =
            player.name + " played " +
            (card.kind === "evil4"
              ? "EVIL 4."
              : card.kind === "add"
              ? "ADD."
              : String(card.value) + ".");
        }

        finishAction(state);

        state._addResolvedForTurn = false;

        return state;
      }

    });

    if (!result.committed) {
      showToast("Action was rejected.");
    }

  } catch (error) {
    console.error(error);
    showToast(error.message);
  }
}

/* ============================================================
   2-1 DISCARD TRANSACTION
============================================================ */

async function discardAfterTwoOne(cardIds) {

  if (!roomCode || !uid) return;

  const room = ref(db, "rooms/" + roomCode);

  await runTransaction(room, state => {

    if (!state || state.status !== "playing") return;

    if (!state.pendingDiscard) return;

    if (state.pendingDiscard.uid !== uid) return;

    const player = getPlayer(state, uid);

    if (!player) return;

    const count = state.pendingDiscard.count;

    const ids = Array.isArray(cardIds)
      ? cardIds.slice(0, count)
      : [];

    if (ids.length !== count) return;

    const unique = new Set(ids);

    if (unique.size !== count) return;

    if (!ids.every(id =>
      player.hand.some(c => c.id === id)
    )) return;

    player.hand =
      player.hand.filter(c => !unique.has(c.id));

    state.pendingDiscard = null;

    if (handSum(player) > 21) {
      player.clutch = true;
    } else {
      player.clutch = false;
    }

    finishAction(state);

    state._addResolvedForTurn = false;

    return state;
  });
}

/* ============================================================
   TURN TIMER
============================================================ */

let timerInterval = null;

function startTimerLoop() {

  clearInterval(timerInterval);

  timerInterval = setInterval(async () => {

    if (!roomState) return;

    if (
      roomState.status !== "playing" ||
      roomState.currentPlayerUid !== uid
    ) {
      renderTimer();
      return;
    }

    if (!roomState.turnEndsAt) return;

    const remaining =
      roomState.turnEndsAt - serverNow();

    if (remaining <= 0) {

      clearInterval(timerInterval);

      const player = localPlayer(roomState);

      if (player?.clutch) {
        showToast("Clutch required.");
        return;
      }

      await performAction({ type:"draw" });

      setTimeout(startTimerLoop, 500);
    }

    renderTimer();

  }, 250);
}

function renderTimer() {

  if (!roomState?.turnEndsAt) {
    $("timer").textContent = "30";
    return;
  }

  const remaining =
    Math.max(0, roomState.turnEndsAt - serverNow());

  $("timer").textContent =
    Math.ceil(remaining / 1000);
}

/* ============================================================
   UI CARD CREATION
============================================================ */

function cardElement(card, clickable = false) {

  const div = document.createElement("div");

  div.className =
    "card " +
    (card.color || "blue") +
    (clickable ? " clickable" : "");

  const value = document.createElement("div");
  value.className = "value";
  value.textContent = card.value;

  div.appendChild(value);

  if (card.kind !== "normal") {

    const special = document.createElement("div");
    special.className = "special";
    special.textContent =
      SPECIALS[card.kind]?.label || card.kind.toUpperCase();

    div.appendChild(special);
  }

  const dot = document.createElement("div");
  dot.className = "dot";
  div.appendChild(dot);

  return div;
}

function backCard(count) {

  const div = document.createElement("div");
  div.className = "card back";

  const q = document.createElement("div");
  q.className = "question";
  q.textContent = "?";

  const c = document.createElement("div");
  c.className = "count";
  c.textContent = count + " cards";

  div.appendChild(q);
  div.appendChild(c);

  return div;
}

/* ============================================================
   RENDER PLAYERS
============================================================ */

function renderPlayers(state) {

  const container = $("players");
  container.innerHTML = "";

  const players = playersArray(state);

  const local =
    players.find(p => p.uid === uid);

  const opponents =
    players.filter(p => p.uid !== uid);

  const positions = [
    [50, 87],
    [18, 63],
    [20, 25],
    [50, 13],
    [80, 25],
    [82, 63]
  ];

  /*
    Local player is always bottom center.
    Other players occupy the remaining positions.
  */

  if (local) {

    createPlayerSeat(
      local,
      50,
      84,
      true
    );
  }

  opponents.forEach((player, index) => {

    const position =
      positions[(index + 1) % positions.length];

    createPlayerSeat(
      player,
      position[0],
      position[1],
      false
    );
  });

  function createPlayerSeat(player,x,y,isLocal) {

    const seat = document.createElement("div");

    seat.className = "player";

    seat.style.left = x + "%";
    seat.style.top = y + "%";

    const box = document.createElement("div");

    box.className =
      "player-box" +
      (state.currentPlayerUid === player.uid
        ? " active"
        : "") +
      (isLocal ? " local" : "");

    const name = document.createElement("div");
    name.className = "player-name";
    name.textContent =
      player.name + (isLocal ? " (YOU)" : "");

    const meta = document.createElement("div");
    meta.className = "player-meta";

    meta.textContent =
      "Cards: " +
      (player.hand?.length || 0) +
      " | Sum: " +
      handSum(player);

    box.appendChild(name);
    box.appendChild(meta);

    if (!isLocal) {

      const cards = document.createElement("div");
      cards.className = "opponent-cards";

      for (
        let i = 0;
        i < Math.min(player.hand?.length || 0, 8);
        i++
      ) {
        cards.appendChild(backCard(player.hand.length));
      }

      box.appendChild(cards);
    }

    seat.appendChild(box);
    container.appendChild(seat);
  }
}

/* ============================================================
   RENDER MIDDLE
============================================================ */

function renderMiddle(state) {

  $("middleSum").textContent =
    middleSum(state);

  const container =
    $("middleCards");

  container.innerHTML = "";

  for (const card of state.middle || []) {

    const el = cardElement(card);

    if (
      pendingAction?.type === "discardMiddle"
    ) {

      el.classList.add("selectable");

      el.addEventListener("click", () => {

        pendingAction = null;

        performAction({
          type:"play",
          cardId: pendingDiscardCard.id,
          targetId: card.id
        });

        pendingDiscardCard = null;

        render(state);
      });
    }

    container.appendChild(el);
  }

  if (pendingAction?.type === "discardMiddle") {
    $("middleHint").textContent =
      "Choose a middle-pile card to discard.";

  } else {
    $("middleHint").textContent =
      "";
  }
}

/* ============================================================
   RENDER HAND
============================================================ */

function renderHand(state) {

  const player = localPlayer(state);

  if (!player) return;

  $("handSum").textContent =
    handSum(player);

  const container =
    $("handCards");

  container.innerHTML = "";

  const legal =
    new Set(
      normalPlayable(state, player)
        .map(c => c.id)
    );

  for (const card of player.hand || []) {

    const el =
      cardElement(card, true);

    if (
      state.currentPlayerUid !== uid ||
      !legal.has(card.id)
    ) {
      el.classList.add("disabled");
    }

    el.addEventListener("click", () => {

      if (!isMyTurn(state)) return;

      if (!legal.has(card.id)) {

        if (player.clutch) {
          showToast(
            "That card cannot resolve your clutch."
          );
        } else {
          showToast(
            "That card cannot be played."
          );
        }

        return;
      }

      if (card.kind === "discard") {

        pendingDiscardCard = card;
        pendingAction = {
          type:"discardMiddle"
        };

        render(state);
        return;
      }

      if (card.kind === "switch") {

        showSwitchChoices(card);
        return;
      }

      if (card.kind === "twoone") {

        showTwoOneChoices(card);
        return;
      }

      performAction({
        type:"play",
        cardId:card.id
      });

    });

    container.appendChild(el);
  }
}

/* ============================================================
   2-1 CHOICE
============================================================ */

function showTwoOneChoices(card) {

  openChoice(
    "2-1",
    "Choose how to execute the card.",
    [
      {
        title:"Draw 2, discard 1",
        description:"Draw two cards, then discard one.",
        action:async () => {

          closeChoice();

          await performAction({
            type:"play",
            cardId:card.id,
            mode:"draw2discard1"
          });

          setTimeout(() => {
            chooseTwoOneDiscards(1);
          }, 500);
        }
      },
      {
        title:"Draw 1, discard 2",
        description:"Draw one card, then discard two.",
        action:async () => {

          closeChoice();

          await performAction({
            type:"play",
            cardId:card.id,
            mode:"draw1discard2"
          });

          setTimeout(() => {
            chooseTwoOneDiscards(2);
          }, 500);
        }
      }
    ]
  );
}

function chooseTwoOneDiscards(count) {

  if (!roomState) return;

  const player =
    localPlayer(roomState);

  if (!player) return;

  const selected = [];

  function chooseNext() {

    openChoice(
      "2-1 Discard",
      "Choose " +
      (count - selected.length) +
      " card(s) to discard.",
      player.hand.map(card => ({
        title:
          card.kind === "normal"
            ? String(card.value)
            : SPECIALS[card.kind].label,

        description:
          card.color.toUpperCase() +
          " • Value " +
          card.value,

        action:() => {

          if (selected.includes(card.id)) return;

          selected.push(card.id);

          if (selected.length === count) {

            closeChoice();

            discardAfterTwoOne(selected);

          } else {

            chooseNext();
          }
        }
      }))
    );
  }

  chooseNext();
}

/* ============================================================
   SWITCH CHOICE
============================================================ */

function showSwitchChoices(card) {

  const targets =
    playersArray(roomState)
      .filter(p => p.uid !== uid);

  openChoice(
    "Switch Hands",
    "Choose a player.",
    targets.map(target => ({
      title:target.name,
      description:
        target.hand.length +
        " cards • Sum " +
        handSum(target),

      action:() => {

        closeChoice();

        performAction({
          type:"play",
          cardId:card.id,
          targetUid:target.uid
        });
      }
    }))
  );
}

/* ============================================================
   CHOICE MODAL
============================================================ */

function openChoice(title,description,options) {

  $("choiceTitle").textContent = title;
  $("choiceDescription").textContent = description;

  const container =
    $("choiceOptions");

  container.innerHTML = "";

  options.forEach(option => {

    const button =
      document.createElement("button");

    button.className =
      "choice-option";

    const strong =
      document.createElement("strong");

    strong.textContent =
      option.title;

    button.appendChild(strong);

    if (option.description) {

      const small =
        document.createElement("small");

      small.textContent =
        option.description;

      button.appendChild(small);
    }

    button.addEventListener(
      "click",
      option.action
    );

    container.appendChild(button);
  });

  $("choiceModal")
    .classList.remove("hidden");
}

function closeChoice() {

  $("choiceModal")
    .classList.add("hidden");
}

$("closeChoiceBtn")
  .addEventListener("click",closeChoice);

$("cancelActionBtn")
  .addEventListener("click",() => {

    pendingAction = null;
    pendingDiscardCard = null;

    render(roomState);
  });

/* ============================================================
   RENDER
============================================================ */

function render(state) {

  roomState = state;

  if (!state) return;

  $("roomCodeDisplay").textContent =
    roomCode || "----";

  renderPlayers(state);
  renderMiddle(state);
  renderHand(state);
  renderTimer();

  const myTurn =
    isMyTurn(state);

  $("turnBanner")
    .classList.toggle(
      "show",
      myTurn
    );

  $("turnBanner").textContent =
    myTurn
      ? "YOUR TURN"
      : (
        state.currentPlayerUid
          ? (
            getPlayer(
              state,
              state.currentPlayerUid
            )?.name + "'S TURN"
          )
          : ""
      );

  const player =
    localPlayer(state);

  $("drawDeck")
    .classList.toggle(
      "disabled",
      !myTurn || player?.clutch
    );

  if (
    state.status === "waiting" &&
    state.hostUid === uid
  ) {

    $("startBtn")
      .classList.remove("hidden");

  } else {

    $("startBtn")
      .classList.add("hidden");
  }

  if (state.status === "gameover") {
    renderGameOver(state);
  } else {
    $("overlay")
      .classList.add("hidden");
  }

  if (
    state.pendingDiscard &&
    state.pendingDiscard.uid === uid
  ) {

    chooseTwoOneDiscards(
      state.pendingDiscard.count
    );
  }
}

/* ============================================================
   GAME OVER
============================================================ */

function renderGameOver(state) {

  const loser =
    getPlayer(
      state,
      state.loserUid
    );

  const iLost =
    state.loserUid === uid;

  $("resultTitle").textContent =
    iLost ? "LOSE" : "WIN";

  $("resultText").textContent =
    iLost
      ? (
        state.gameOverReason ||
        "You lost."
      )
      : (
        (loser?.name || "Another player") +
        " lost."
      );

  $("overlay")
    .classList.remove("hidden");
}

/* ============================================================
   TOAST
============================================================ */

function showToast(message) {

  const toast = $("toast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(() => {
      toast.classList.remove("show");
    },3000);
}

/* ============================================================
   LOBBY
============================================================ */

function setLobbyStatus(message,error=false) {

  const element =
    $("lobbyStatus");

  element.textContent =
    message;

  element.style.color =
    error ? "#ff7777" : "#aeb8c9";
}

function cleanName(name) {

  return String(name || "")
    .trim()
    .replace(/\s+/g," ")
    .slice(0,18);
}

function randomRoomCode() {

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for (let i=0;i<6;i++) {
    result +=
      chars[
        Math.floor(
          Math.random()*chars.length
        )
      ];
  }

  return result;
}

/* ============================================================
   CREATE ROOM
============================================================ */

async function createRoom() {

  await authReady;

  const name =
    cleanName(
      $("playerName").value
    );

  if (!name) {
    setLobbyStatus(
      "Enter a player name.",
      true
    );
    return;
  }

  let code =
    $("roomCode").value
      .trim()
      .toUpperCase();

  if (!code) {

    for (let i=0;i<10;i++) {

      const candidate =
        randomRoomCode();

      const snapshot =
        await get(
          ref(
            db,
            "rooms/" + candidate
          )
        );

      if (!snapshot.exists()) {
        code = candidate;
        break;
      }
    }
  }

  if (!code) {

    setLobbyStatus(
      "Could not create a room.",
      true
    );

    return;
  }

  const room = {

    status:"waiting",

    hostUid:uid,

    currentPlayerUid:null,

    turnStartedAt:null,
    turnEndsAt:null,

    drawPile:createDeck(),

    middle:[],

    players:{
      [uid]:{
        uid,
        name,
        seat:0,
        hand:[],
        clutch:false,
        connected:true
      }
    },

    pendingDiscard:null,

    lastAction:"Room created.",
    lastActionAt:serverTimestamp(),

    createdAt:serverTimestamp()
  };

  try {

    const target =
      ref(
        db,
        "rooms/" + code
      );

    const exists =
      await get(target);

    if (exists.exists()) {

      setLobbyStatus(
        "That room already exists.",
        true
      );

      return;
    }

    await set(
      target,
      room
    );

    await enterRoom(code);

  } catch(error) {

    console.error(error);

    setLobbyStatus(
      error.message,
      true
    );
  }
}

/* ============================================================
   JOIN ROOM
============================================================ */

async function joinRoom() {

  await authReady;

  const name =
    cleanName(
      $("playerName").value
    );

  const code =
    $("roomCode").value
      .trim()
      .toUpperCase();

  if (!name) {

    setLobbyStatus(
      "Enter a player name.",
      true
    );

    return;
  }

  if (!code) {

    setLobbyStatus(
      "Enter a room code.",
      true
    );

    return;
  }

  try {

    const room =
      ref(
        db,
        "rooms/" + code
      );

    const snapshot =
      await get(room);

    if (!snapshot.exists()) {

      setLobbyStatus(
        "Room not found.",
        true
      );

      return;
    }

    const state =
      snapshot.val();

    if (state.status !== "waiting") {

      setLobbyStatus(
        "The game has already started.",
        true
      );

      return;
    }

    const players =
      Object.values(
        state.players || {}
      );

    if (players.length >= MAX_PLAYERS) {

      setLobbyStatus(
        "Room is full.",
        true
      );

      return;
    }

    if (state.players?.[uid]) {

      await enterRoom(code);
      return;
    }

    const usedSeats =
      players.map(
        p => p.seat
      );

    let seat = 0;

    while (
      usedSeats.includes(seat)
    ) {
      seat++;
    }

    await update(
      room,
      {
        ["players/" + uid]:{
          uid,
          name,
          seat,
          hand:[],
          clutch:false,
          connected:true
        }
      }
    );

    await enterRoom(code);

  } catch(error) {

    console.error(error);

    setLobbyStatus(
      error.message,
      true
    );
  }
}

/* ============================================================
   START GAME
============================================================ */

async function startGame() {

  if (!roomCode || !uid) return;

  const room =
    ref(
      db,
      "rooms/" + roomCode
    );

  const result =
    await runTransaction(
      room,
      state => {

        if (!state) return;

        if (
          state.status !== "waiting" ||
          state.hostUid !== uid
        ) {
          return;
        }

        const players =
          playersArray(state);

        if (
          players.length < MIN_PLAYERS
        ) {
          return;
        }

        for (const player of players) {

          player.hand = [];
          player.clutch = false;

          for (
            let i=0;
            i<STARTING_HAND;
            i++
          ) {

            player.hand.push(
              drawFromState(state)
            );
          }
        }

        state.status = "playing";

        state.middle = [];

        state.currentPlayerUid =
          players[0].uid;

        state.turnStartedAt =
          serverNow();

        state.turnEndsAt =
          serverNow() + TURN_TIME;

        state._addResolvedForTurn =
          false;

        state.pendingDiscard = null;

        state.lastAction =
          "Game started.";

        return state;
      }
    );

  if (!result.committed) {

    showToast(
      "The game could not be started."
    );
  }
}

/* ============================================================
   ENTER ROOM
============================================================ */

async function enterRoom(code) {

  roomCode = code;

  $("lobby")
    .classList.add("hidden");

  $("game")
    .classList.remove("hidden");

  $("roomCodeDisplay")
    .textContent = code;

  if (roomUnsubscribe) {
    roomUnsubscribe();
  }

  const playerConnection =
    ref(
      db,
      "rooms/" +
      code +
      "/players/" +
      uid +
      "/connected"
    );

  onDisconnect(
    playerConnection
  ).set(false);

  await update(
    ref(
      db,
      "rooms/" +
      code +
      "/players/" +
      uid
    ),
    {
      connected:true
    }
  );

  roomUnsubscribe =
    onValue(
      ref(
        db,
        "rooms/" + code
      ),
      snapshot => {

        if (!snapshot.exists()) {

          showToast(
            "Room no longer exists."
          );

          leaveRoom();
          return;
        }

        render(
          snapshot.val()
        );

      },
      error => {

        console.error(error);

        showToast(
          error.message
        );
      }
    );

  startTimerLoop();
}

/* ============================================================
   LEAVE ROOM
============================================================ */

async function leaveRoom() {

  clearInterval(
    timerInterval
  );

  if (roomUnsubscribe) {
    roomUnsubscribe();
    roomUnsubscribe = null;
  }

  if (roomCode && uid) {

    try {

      const room =
        ref(
          db,
          "rooms/" + roomCode
        );

      const snapshot =
        await get(room);

      if (snapshot.exists()) {

        const state =
          snapshot.val();

        const players =
          playersArray(state);

        if (players.length <= 1) {

          await set(
            room,
            null
          );

        } else {

          const updates = {};

          updates[
            "players/" + uid
          ] = null;

          if (
            state.hostUid === uid
          ) {

            const nextHost =
              players.find(
                p => p.uid !== uid
              );

            if (nextHost) {
              updates.hostUid =
                nextHost.uid;
            }
          }

          await update(
            room,
            updates
          );
        }
      }

    } catch(error) {

      console.error(error);
    }
  }

  roomCode = null;
  roomState = null;

  $("game")
    .classList.add("hidden");

  $("lobby")
    .classList.remove("hidden");

  $("overlay")
    .classList.add("hidden");
}

    "click",
    leaveRoom
  );

$("overlayLeaveBtn")
  .addEventListener(
    "click",
    leaveRoom
  );

$("copyRoomBtn")
  .addEventListener(
    "click",
    async () => {

      if (!roomCode) return;

      try {

        await navigator.clipboard
          .writeText(roomCode);

        showToast(
          "Room code copied."
        );

      } catch {

        showToast(
          "Room code: " + roomCode
        );
      }
    }
  );

$("drawDeck")
  .addEventListener(
    "click",
    () => {

      if (!roomState) return;

      const player =
        localPlayer(roomState);

      if (!isMyTurn(roomState)) {
        return;
      }

      if (player?.clutch) {

        showToast(
          "You must resolve your clutch."
        );

        return;
      }

      performAction({
        type:"draw"
      });
    }
  );

</script>

</body>
</html>
