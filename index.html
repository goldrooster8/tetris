<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>21 Multiplayer Card Game</title>
    <style>
:root {
  color-scheme: dark;
  --bg: #151917;
  --panel: #202720;
  --panel-2: #2c352d;
  --line: rgba(255, 255, 255, 0.14);
  --text: #f5f0df;
  --muted: #c6c0ac;
  --accent: #f1c84b;
  --danger: #ef5f5f;
  --felt: #27523f;
  --felt-dark: #19382b;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 50% 20%, #244435 0%, var(--bg) 62%);
  color: var(--text);
}

button,
input {
  font: inherit;
}

button {
  min-height: 42px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 8px;
  background: var(--accent);
  color: #211d11;
  font-weight: 800;
  cursor: pointer;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

input {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #111511;
  color: var(--text);
  padding: 0 12px;
}

.hidden {
  display: none !important;
}

.app-shell {
  min-height: 100vh;
}

.lobby {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

.lobby-panel {
  width: min(460px, 100%);
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(32, 39, 32, 0.92);
  box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
}

.lobby-panel h1 {
  margin: 0;
  font-size: clamp(44px, 8vw, 76px);
  line-height: 0.9;
  letter-spacing: 0;
}

.lobby-panel p {
  color: var(--muted);
}

.lobby-panel label {
  display: grid;
  gap: 8px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
}

.lobby-actions {
  display: grid;
  gap: 12px;
  margin-top: 18px;
}

.join-row {
  display: grid;
  grid-template-columns: 1fr 92px;
  gap: 10px;
}

.setup-warning {
  min-height: 20px;
  color: var(--danger);
  font-weight: 700;
}

.game {
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  background: rgba(12, 15, 12, 0.78);
  border-bottom: 1px solid var(--line);
}

.top-bar > div,
.hand-meta > div:first-child {
  display: grid;
  gap: 2px;
}

.label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
}

.turn-banner {
  position: fixed;
  top: 74px;
  left: 50%;
  z-index: 8;
  transform: translateX(-50%);
  padding: 10px 18px;
  border-radius: 8px;
  background: var(--accent);
  color: #211d11;
  font-weight: 900;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}

.table-wrap {
  display: grid;
  place-items: center;
  min-height: 520px;
  padding: 22px;
}

.table {
  position: relative;
  width: min(86vw, 980px);
  aspect-ratio: 16 / 9;
  min-height: 430px;
  border: 14px solid #5d3b23;
  border-radius: 50%;
  background:
    radial-gradient(circle at center, rgba(255, 255, 255, 0.08), transparent 52%),
    linear-gradient(145deg, var(--felt), var(--felt-dark));
  box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.32), 0 28px 80px rgba(0, 0, 0, 0.45);
  overflow: hidden;
}

.seats-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.seat {
  position: absolute;
  width: 156px;
  display: grid;
  gap: 7px;
  place-items: center;
  transform: translate(-50%, -50%);
  pointer-events: auto;
}

.seat.local {
  display: none;
}

.seat-name {
  max-width: 156px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 5px 9px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.34);
  font-size: 13px;
  font-weight: 900;
}

.seat.active .seat-name {
  background: var(--accent);
  color: #211d11;
}

.opponent-hand {
  display: flex;
  justify-content: center;
  min-height: 70px;
}

.card-back {
  width: 42px;
  height: 58px;
  display: grid;
  place-items: center;
  margin-left: -18px;
  border: 2px solid rgba(255, 255, 255, 0.72);
  border-radius: 7px;
  background: repeating-linear-gradient(135deg, #293346, #293346 8px, #3d4c68 8px, #3d4c68 16px);
  color: white;
  font-weight: 900;
}

.card-back:first-child {
  margin-left: 0;
}

.count-pill {
  padding: 4px 8px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.38);
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}

.center-zone {
  position: absolute;
  inset: 50% auto auto 50%;
  width: min(520px, 74%);
  transform: translate(-50%, -50%);
  display: grid;
  grid-template-columns: 108px 1fr;
  gap: 18px;
  align-items: center;
}

.deck {
  width: 100%;
  aspect-ratio: 3 / 4;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 8px;
  border: 3px solid rgba(255, 255, 255, 0.72);
  background: repeating-linear-gradient(135deg, #27344a, #27344a 12px, #3f5478 12px, #3f5478 24px);
  color: #fff;
}

.deck span {
  font-size: 48px;
  line-height: 1;
}

.middle-panel {
  min-height: 190px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.22);
}

.middle-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  color: var(--muted);
  font-weight: 900;
}

.middle-pile,
.local-hand {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.middle-pile {
  min-height: 126px;
}

.hand-area {
  padding: 14px 18px 18px;
  background: rgba(12, 15, 12, 0.84);
  border-top: 1px solid var(--line);
}

.hand-meta {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 14px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.status-line {
  color: var(--muted);
  font-weight: 700;
  text-align: right;
  flex: 1 1 220px;
}

.local-hand {
  min-height: 128px;
}

.card {
  position: relative;
  width: 78px;
  height: 110px;
  display: grid;
  grid-template-rows: 1fr auto;
  place-items: center;
  padding: 9px 7px;
  border: 2px solid rgba(255, 255, 255, 0.76);
  border-radius: 8px;
  color: #111;
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22);
  user-select: none;
}

button.card {
  min-height: 110px;
}

.card.playable {
  outline: 3px solid var(--accent);
}

.card-value {
  font-size: 34px;
  font-weight: 950;
  line-height: 1;
}

.card-badge {
  width: 100%;
  min-height: 19px;
  display: grid;
  place-items: center;
  padding: 2px 4px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.78);
  font-size: 10px;
  font-weight: 950;
  text-align: center;
}

.card.red {
  background: #f26d68;
}

.card.blue {
  background: #5ca2f2;
}

.card.green {
  background: #69c36d;
}

.card.yellow {
  background: #f1d35d;
}

.modal,
.game-over {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 22px;
  background: rgba(0, 0, 0, 0.62);
}

.modal-panel,
.game-over-panel {
  width: min(520px, 100%);
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: 0 24px 90px rgba(0, 0, 0, 0.55);
}

.modal-panel h2,
.game-over-panel h2 {
  margin: 0 0 8px;
}

.modal-panel p,
.game-over-panel p {
  color: var(--muted);
}

.modal-actions {
  display: grid;
  gap: 10px;
}

.modal-actions .danger {
  background: var(--danger);
  color: #fff;
}

.game-over-panel {
  text-align: center;
}

@media (max-width: 720px) {
  .top-bar,
  .hand-meta {
    align-items: start;
    flex-direction: column;
  }

  .status-line {
    text-align: left;
  }

  .table-wrap {
    min-height: 440px;
    padding: 12px;
  }

  .table {
    width: 100%;
    min-height: 390px;
    border-width: 9px;
  }

  .center-zone {
    width: 82%;
    grid-template-columns: 82px 1fr;
    gap: 10px;
  }

  .middle-panel {
    min-height: 168px;
  }

  .card {
    width: 62px;
    height: 90px;
  }

  button.card {
    min-height: 90px;
  }

  .card-value {
    font-size: 26px;
  }

  .seat {
    width: 112px;
  }

  .seat-name {
    max-width: 112px;
  }
}

</style>
  </head>
  <body>
    <main class="app-shell">
      <section id="lobby" class="lobby">
        <div class="lobby-panel">
          <h1>21</h1>
          <p>Realtime multiplayer card survival. Create a room, share the code, and stay under 21.</p>

          <label>
            Display name
            <input id="playerNameInput" maxlength="18" placeholder="Player" autocomplete="off" />
          </label>

          <div class="lobby-actions">
            <button id="createRoomBtn" type="button">Create Room</button>
            <div class="join-row">
              <input id="roomCodeInput" maxlength="8" placeholder="Room code" autocomplete="off" />
              <button id="joinRoomBtn" type="button">Join</button>
            </div>
          </div>

          <p id="setupWarning" class="setup-warning"></p>
        </div>
      </section>

      <section id="game" class="game hidden" aria-live="polite">
        <header class="top-bar">
          <div>
            <span class="label">Room</span>
            <strong id="roomCodeLabel">----</strong>
          </div>
          <div>
            <span class="label">Turn</span>
            <strong id="turnLabel">Waiting</strong>
          </div>
          <div>
            <span class="label">Timer</span>
            <strong id="timerLabel">30</strong>
          </div>
        </header>

        <div id="turnBanner" class="turn-banner hidden">YOUR TURN</div>

        <section class="table-wrap">
          <div id="table" class="table">
            <div id="seatsLayer" class="seats-layer"></div>

            <div class="center-zone">
              <button id="deckBtn" class="deck" type="button" aria-label="Draw card">
                <span>?</span>
                <small>DRAW</small>
              </button>

              <div class="middle-panel">
                <div class="middle-head">
                  <span>Middle</span>
                  <strong id="middleSumLabel">0 / 21</strong>
                </div>
                <div id="middlePile" class="middle-pile"></div>
              </div>
            </div>
          </div>
        </section>

        <footer class="hand-area">
          <div class="hand-meta">
            <div>
              <span class="label">Your hand</span>
              <strong id="localSumLabel">0 / 21</strong>
            </div>
            <div id="statusLine" class="status-line">Waiting for players.</div>
            <button id="startBtn" class="hidden" type="button">Start Game</button>
          </div>
          <div id="localHand" class="local-hand"></div>
        </footer>
      </section>

      <div id="choiceModal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-panel">
          <h2 id="choiceTitle">Choose</h2>
          <p id="choiceText"></p>
          <div id="choiceActions" class="modal-actions"></div>
        </div>
      </div>

      <div id="gameOver" class="game-over hidden" role="dialog" aria-modal="true">
        <div class="game-over-panel">
          <h2 id="resultTitle">Game Over</h2>
          <p id="resultText"></p>
          <button id="leaveBtn" type="button">Back to Lobby</button>
        </div>
      </div>
    </main>

    <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getDatabase,
  ref,
  get,
  set,
  update,
  onValue,
  onDisconnect,
  serverTimestamp,
  runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBfOKGz06urUqutCnDUfy6P2hMswoBifq8",
  authDomain: "bomb-game-782c2.firebaseapp.com",
  databaseURL: "https://bomb-game-782c2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bomb-game-782c2",
  storageBucket: "bomb-game-782c2.firebasestorage.app",
  messagingSenderId: "984947565972",
  appId: "1:984947565972:web:486661db2f7dab317bdb81"
};

const CONFIG = {
  handLimit: 21,
  middleLimit: 21,
  startingCards: 3,
  turnSeconds: 30,
  minPlayers: 2,
  maxPlayers: 8,
  colors: ["red", "blue", "green", "yellow"],
  specialTypes: {
    discard: { value: 3, label: "DISCARD" },
    add: { value: 5, label: "ADD" },
    twoOne: { value: 3, label: "2-1" },
    evil4: { value: 4, label: "EVIL 4" },
    switch: { value: 8, label: "SWITCH" }
  }
};

const els = {
  lobby: document.querySelector("#lobby"),
  game: document.querySelector("#game"),
  playerNameInput: document.querySelector("#playerNameInput"),
  roomCodeInput: document.querySelector("#roomCodeInput"),
  createRoomBtn: document.querySelector("#createRoomBtn"),
  joinRoomBtn: document.querySelector("#joinRoomBtn"),
  setupWarning: document.querySelector("#setupWarning"),
  roomCodeLabel: document.querySelector("#roomCodeLabel"),
  turnLabel: document.querySelector("#turnLabel"),
  timerLabel: document.querySelector("#timerLabel"),
  turnBanner: document.querySelector("#turnBanner"),
  table: document.querySelector("#table"),
  seatsLayer: document.querySelector("#seatsLayer"),
  deckBtn: document.querySelector("#deckBtn"),
  middleSumLabel: document.querySelector("#middleSumLabel"),
  middlePile: document.querySelector("#middlePile"),
  localSumLabel: document.querySelector("#localSumLabel"),
  statusLine: document.querySelector("#statusLine"),
  startBtn: document.querySelector("#startBtn"),
  localHand: document.querySelector("#localHand"),
  choiceModal: document.querySelector("#choiceModal"),
  choiceTitle: document.querySelector("#choiceTitle"),
  choiceText: document.querySelector("#choiceText"),
  choiceActions: document.querySelector("#choiceActions"),
  gameOver: document.querySelector("#gameOver"),
  resultTitle: document.querySelector("#resultTitle"),
  resultText: document.querySelector("#resultText"),
  leaveBtn: document.querySelector("#leaveBtn")
};

let app;
let db;
let currentRoomCode = "";
let localPlayerId = localStorage.getItem("twentyOnePlayerId") || crypto.randomUUID();
let latestGame = null;
let unsubscribeRoom = null;
let timerInterval = null;
let resolvingChoice = false;

localStorage.setItem("twentyOnePlayerId", localPlayerId);
els.playerNameInput.value = localStorage.getItem("twentyOnePlayerName") || "";

function isFirebaseConfigured() {
  return !firebaseConfig.apiKey.includes("PASTE_") && !firebaseConfig.databaseURL.includes("PASTE_");
}

function boot() {
  if (!isFirebaseConfigured()) {
    els.setupWarning.textContent = "Add your Firebase config in script.js before hosting.";
    els.createRoomBtn.disabled = true;
    els.joinRoomBtn.disabled = true;
    return;
  }

  app = initializeApp(firebaseConfig);
  db = getDatabase(app);
}

function roomRef(roomCode) {
  return ref(db, `rooms/${roomCode}`);
}

function playerRef(roomCode, playerId) {
  return ref(db, `rooms/${roomCode}/players/${playerId}`);
}

function cleanName() {
  const name = els.playerNameInput.value.trim().slice(0, 18) || "Player";
  localStorage.setItem("twentyOnePlayerName", name);
  return name;
}

function makeRoomCode() {
  return Math.random().toString(36).slice(2, 8).toUpperCase();
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

/**
 * Normal card values:
 *   20% -> 0
 *   60% -> 1..6  (uniform)
 *   20% -> 7..12 (uniform)
 */
function rollNormalValue() {
  const r = Math.random();
  if (r < 0.2) return 0;
  if (r < 0.8) return randInt(1, 6);
  return randInt(7, 12);
}

function makeCard() {
  const color = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
  const roll = Math.random();
  if (roll < 0.75) {
    return { id: crypto.randomUUID(), color, type: "normal", value: rollNormalValue() };
  }

  const specialKeys = Object.keys(CONFIG.specialTypes);
  const type = specialKeys[Math.floor(Math.random() * specialKeys.length)];
  return { id: crypto.randomUUID(), color, type, value: CONFIG.specialTypes[type].value };
}

function drawCards(count) {
  return Array.from({ length: count }, makeCard);
}

function cardValue(card) {
  return Number(card?.value || 0);
}

function sumCards(cards = []) {
  return cards.reduce((sum, card) => sum + cardValue(card), 0);
}

function sortPlayers(playersObj = {}, order = []) {
  const players = Object.values(playersObj).filter(Boolean);
  const byId = Object.fromEntries(players.map((player) => [player.id, player]));
  return order.map((id) => byId[id]).filter(Boolean);
}

function middleSum(game) {
  return sumCards(game.middle || []);
}

function activeAdds(game) {
  return (game.middle || []).filter((card) => card.type === "add").length;
}

function flushRequirement(middle = []) {
  return middle.some((card) => card.type === "evil4") ? 4 : 3;
}

function applyFlushes(middle) {
  let pile = [...middle];
  let changed = true;
  while (changed) {
    changed = false;
    const need = flushRequirement(pile);
    for (const color of CONFIG.colors) {
      const matching = pile.filter((card) => card.color === color);
      if (matching.length >= need) {
        const removeIds = new Set(matching.slice(0, need).map((card) => card.id));
        pile = pile.filter((card) => !removeIds.has(card.id));
        changed = true;
        break;
      }
    }
  }
  return pile;
}

function canPlayCard(game, card, middleOverride = null) {
  const pile = middleOverride || game.middle || [];
  if (card.type === "discard") {
    return pile.length > 0 || sumCards([...pile, card]) <= CONFIG.middleLimit;
  }
  return sumCards([...pile, card]) <= CONFIG.middleLimit;
}

function playableCards(game, player) {
  return (player.hand || []).filter((card) => canPlayCard(game, card));
}

function nextTurnPatch(game, playerId, options = {}) {
  const order = game.turnOrder || [];
  const currentIndex = Math.max(0, order.indexOf(playerId));
  const nextIndex = (currentIndex + 1) % order.length;
  const nextPlayerId = order[nextIndex];
  const patch = {
    activePlayerId: nextPlayerId,
    turnStartedAt: Date.now(),
    turnForcedAddResolved: false,
    phase: "turn",
    pending: null,
    message: options.message || ""
  };
  const nextPlayer = game.players?.[nextPlayerId];
  if (nextPlayer?.over21Pending) {
    patch.phase = "clutch";
    patch.message = `${nextPlayer.name} must clutch (get back to 21 or less).`;
  }
  return patch;
}

async function createRoom() {
  const name = cleanName();
  let code = makeRoomCode();
  while ((await get(roomRef(code))).exists()) code = makeRoomCode();

  const firstHand = drawCards(CONFIG.startingCards);
  const game = {
    roomCode: code,
    createdAt: serverTimestamp(),
    status: "waiting",
    hostId: localPlayerId,
    activePlayerId: localPlayerId,
    turnStartedAt: Date.now(),
    turnForcedAddResolved: false,
    turnOrder: [localPlayerId],
    middle: [],
    discard: [],
    pending: null,
    phase: "waiting",
    message: "Waiting for players (1/2). The host can start when ready.",
    winnerId: null,
    loserId: null,
    players: {
      [localPlayerId]: {
        id: localPlayerId,
        name,
        hand: firstHand,
        connected: true,
        over21Pending: false
      }
    }
  };

  await set(roomRef(code), game);
  await onDisconnect(playerRef(code, localPlayerId)).update({ connected: false });
  enterRoom(code);
}

async function joinRoom() {
  const code = els.roomCodeInput.value.trim().toUpperCase();
  if (!code) return;
  const snap = await get(roomRef(code));
  if (!snap.exists()) {
    els.setupWarning.textContent = "Room not found.";
    return;
  }

  const game = snap.val();
  if (game.status !== "waiting") {
    els.setupWarning.textContent = "That game already started.";
    return;
  }

  const players = sortPlayers(game.players, game.turnOrder);
  if (!game.players?.[localPlayerId] && players.length >= CONFIG.maxPlayers) {
    els.setupWarning.textContent = "Room is full.";
    return;
  }

  const name = cleanName();
  await runTransaction(roomRef(code), (current) => {
    if (!current || current.status !== "waiting") return current;
    current.players = current.players || {};
    current.turnOrder = current.turnOrder || [];
    if (!current.players[localPlayerId]) {
      current.players[localPlayerId] = {
        id: localPlayerId,
        name,
        hand: drawCards(CONFIG.startingCards),
        connected: true,
        over21Pending: false
      };
      current.turnOrder.push(localPlayerId);
    } else {
      current.players[localPlayerId].connected = true;
      current.players[localPlayerId].name = name;
    }
    // NOTE: we intentionally do NOT auto-start the game here.
    const count = current.turnOrder.length;
    current.message =
      count < CONFIG.minPlayers
        ? `Waiting for players (${count}/${CONFIG.minPlayers}).`
        : `${count} player${count === 1 ? "" : "s"} ready. The host can start the game.`;
    return current;
  });

  await onDisconnect(playerRef(code, localPlayerId)).update({ connected: false });
  enterRoom(code);
}

async function startGame() {
  await runTransaction(roomRef(currentRoomCode), (game) => {
    if (!game || game.status !== "waiting") return game;
    if (game.hostId !== localPlayerId) return game;
    const order = game.turnOrder || [];
    if (order.length < CONFIG.minPlayers) return game;

    game.status = "playing";
    game.phase = "turn";
    game.activePlayerId = order[0];
    game.turnStartedAt = Date.now();
    game.turnForcedAddResolved = false;
    game.pending = null;
    game.message = "Game started. Good luck!";
    return game;
  });
}

function enterRoom(code) {
  currentRoomCode = code;
  els.lobby.classList.add("hidden");
  els.game.classList.remove("hidden");
  els.roomCodeLabel.textContent = code;
  if (unsubscribeRoom) unsubscribeRoom();
  unsubscribeRoom = onValue(roomRef(code), (snap) => {
    latestGame = snap.val();
    if (!latestGame) {
      leaveRoom();
      return;
    }
    render();
    maybeHandleTurnAutomation();
  });
}

function render() {
  const game = latestGame;
  const local = game.players?.[localPlayerId];
  const players = sortPlayers(game.players, game.turnOrder);
  const active = game.players?.[game.activePlayerId];
  const isLocalTurn = game.activePlayerId === localPlayerId && game.status === "playing";
  const isHost = game.hostId === localPlayerId;
  const canStart =
    game.status === "waiting" &&
    isHost &&
    (game.turnOrder || []).length >= CONFIG.minPlayers;

  els.turnLabel.textContent = active?.name || "Waiting";
  els.middleSumLabel.textContent = `${middleSum(game)} / ${CONFIG.middleLimit}`;
  els.localSumLabel.textContent = `${sumCards(local?.hand || [])} / ${CONFIG.handLimit}`;
  els.statusLine.textContent = game.message || "";
  els.turnBanner.classList.toggle("hidden", !isLocalTurn);
  els.startBtn.classList.toggle("hidden", !canStart);
  els.deckBtn.disabled =
    !isLocalTurn ||
    game.phase !== "turn" ||
    Boolean(game.pending) ||
    resolvingChoice;

  renderSeats(players, game);
  renderCards(els.middlePile, game.middle || [], { interactive: game.pending?.type === "discardTarget" });
  renderLocalHand(local, game, isLocalTurn);
  renderPendingPrompt(game);
  renderTimer(game);
  renderGameOver(game);
}

function renderPendingPrompt(game) {
  const pending = game.pending;
  if (pending?.type === "twoOneDiscard" && pending.playerId === localPlayerId && !resolvingChoice) {
    promptTwoOneDiscards();
  }
}

function renderSeats(players, game) {
  els.seatsLayer.innerHTML = "";
  const localIndex = Math.max(0, players.findIndex((player) => player.id === localPlayerId));
  const ordered = [...players.slice(localIndex), ...players.slice(0, localIndex)];
  const opponents = ordered.filter((player) => player.id !== localPlayerId);

  opponents.forEach((player, index) => {
    const angle = -90 + ((index + 1) * 360) / Math.max(2, ordered.length);
    const radiusX = 42;
    const radiusY = 36;
    const x = 50 + Math.cos((angle * Math.PI) / 180) * radiusX;
    const y = 50 + Math.sin((angle * Math.PI) / 180) * radiusY;
    const seat = document.createElement("div");
    seat.className = `seat${player.id === game.activePlayerId ? " active" : ""}`;
    seat.style.left = `${x}%`;
    seat.style.top = `${y}%`;
    seat.innerHTML = `
      <div class="seat-name">${escapeHtml(player.name)}</div>
      <div class="opponent-hand">${renderBacks(player.hand?.length || 0)}</div>
      <div class="count-pill">${player.hand?.length || 0} cards</div>
    `;
    els.seatsLayer.appendChild(seat);
  });
}

function renderBacks(count) {
  return Array.from({ length: Math.min(count, 7) }, () => `<span class="card-back">?</span>`).join("");
}

function renderLocalHand(player, game, isLocalTurn) {
  els.localHand.innerHTML = "";
  const hand = player?.hand || [];
  const playable = new Set(playableCards(game, player || {}).map((card) => card.id));
  hand.forEach((card) => {
    const button = createCardElement(card, true);
    const canClick =
      isLocalTurn &&
      !game.pending &&
      (game.phase === "turn" || game.phase === "clutch") &&
      playable.has(card.id) &&
      !resolvingChoice;
    button.disabled = !canClick;
    button.classList.toggle("playable", canClick);
    button.addEventListener("click", () => playCard(card.id));
    els.localHand.appendChild(button);
  });
}

function renderCards(container, cards, options = {}) {
  container.innerHTML = "";
  cards.forEach((card) => {
    const el = createCardElement(card, Boolean(options.interactive));
    if (options.interactive) {
      el.addEventListener("click", () => chooseDiscardTarget(card.id));
    }
    container.appendChild(el);
  });
}

function createCardElement(card, asButton) {
  const el = document.createElement(asButton ? "button" : "div");
  el.className = `card ${card.color}`;
  el.type = asButton ? "button" : undefined;
  const label = card.type === "normal" ? "" : CONFIG.specialTypes[card.type].label;
  el.innerHTML = `
    <div class="card-value">${card.value}</div>
    <div class="card-badge">${label || card.color.toUpperCase()}</div>
  `;
  return el;
}

function renderTimer(game) {
  clearInterval(timerInterval);
  let fired = false;

  const updateTimer = () => {
    if (game.status !== "playing") {
      els.timerLabel.textContent = "--";
      return;
    }
    const elapsed = Math.floor((Date.now() - Number(game.turnStartedAt || Date.now())) / 1000);
    const remaining = Math.max(0, CONFIG.turnSeconds - elapsed);
    els.timerLabel.textContent = String(remaining);

    if (
      remaining === 0 &&
      !fired &&
      game.activePlayerId === localPlayerId &&
      !game.pending &&
      !resolvingChoice
    ) {
      fired = true;
      if (game.phase === "clutch") {
        loseGame(`${game.players?.[localPlayerId]?.name || "Player"} ran out of time while clutching.`);
      } else {
        autoDrawForTimeout();
      }
    }
  };

  updateTimer();
  timerInterval = setInterval(updateTimer, 300);
}

function renderGameOver(game) {
  const over = game.status === "gameOver";
  els.gameOver.classList.toggle("hidden", !over);
  if (!over) return;
  const didLose = game.loserId === localPlayerId;
  els.resultTitle.textContent = didLose ? "LOSE" : "WIN";
  const loser = game.players?.[game.loserId];
  els.resultText.textContent = loser ? `${loser.name} busted. The game is over.` : "The game is over.";
}

async function maybeHandleTurnAutomation() {
  const game = latestGame;
  if (
    !game ||
    game.status !== "playing" ||
    game.activePlayerId !== localPlayerId ||
    game.pending ||
    resolvingChoice
  ) {
    return;
  }
  const player = game.players?.[localPlayerId];
  if (!player) return;

  // Forced draws from active ADD cards at the start of your turn.
  if (!game.turnForcedAddResolved) {
    const addCount = activeAdds(game);
    if (addCount > 0) {
      await resolveAddDraws(addCount);
      return;
    }
  }

  // Clutch: you went over 21 earlier and now must get back under.
  // If you have no legal play left, you bust.
  const isOver = sumCards(player.hand || []) > CONFIG.handLimit;
  const isClutch = game.phase === "clutch" || player.over21Pending;
  if (isClutch && isOver && playableCards(game, player).length === 0) {
    await loseGame(`${player.name} could not clutch and busted.`);
    return;
  }

  // NOTE: We deliberately do NOT auto-draw when the player simply has no
  // playable cards. The player must click the deck themselves.
}

async function resolveAddDraws(addCount) {
  await runTransaction(roomRef(currentRoomCode), (game) => {
    if (!isCurrentTurnGame(game)) return game;
    const player = game.players[localPlayerId];
    player.hand = [...(player.hand || []), ...drawCards(addCount)];
    game.turnForcedAddResolved = true;
    const total = sumCards(player.hand);
    if (total > CONFIG.handLimit) {
      game.phase = "clutch";
      player.over21Pending = true;
      game.message = `${player.name} drew ${addCount} from Add and is over 21 — clutch now!`;
    } else {
      game.message = `${player.name} drew ${addCount} from active Add card${addCount === 1 ? "" : "s"}.`;
    }
    return game;
  });
}

async function drawAction(forced = false) {
  await runTransaction(roomRef(currentRoomCode), (game) => {
    if (!isCurrentTurnGame(game) || game.phase !== "turn") return game;
    const player = game.players[localPlayerId];
    player.hand = [...(player.hand || []), makeCard()];
    const over = sumCards(player.hand) > CONFIG.handLimit;
    if (over) player.over21Pending = true;
    Object.assign(
      game,
      nextTurnPatch(game, localPlayerId, {
        message: forced
          ? `${player.name} had no playable cards and drew.`
          : `${player.name} drew a card.`
      })
    );
    return game;
  });
}

async function autoDrawForTimeout() {
  if (!latestGame || latestGame.activePlayerId !== localPlayerId || latestGame.phase !== "turn") return;
  await drawAction(false);
}

async function playCard(cardId) {
  const game = latestGame;
  if (!isCurrentTurnGame(game)) return;
  const player = game.players[localPlayerId];
  const card = (player.hand || []).find((item) => item.id === cardId);
  if (!card || !canPlayCard(game, card)) return;

  if (card.type === "discard" && (game.middle || []).length > 0) {
    await update(roomRef(currentRoomCode), {
      pending: { type: "discardTarget", playerId: localPlayerId, cardId },
      message: `${player.name} is choosing a middle card to discard.`
    });
    return;
  }

  if (card.type === "twoOne") {
    showChoice("2-1", "Choose the order for this card.", [
      { label: "Draw 2, discard 1", action: () => resolveTwoOne(cardId, "draw2Discard1") },
      { label: "Draw 1, discard 2", action: () => resolveTwoOne(cardId, "draw1Discard2") }
    ]);
    return;
  }

  if (card.type === "switch") {
    const targets = sortPlayers(game.players, game.turnOrder).filter((item) => item.id !== localPlayerId);
    showChoice(
      "Switch",
      "Choose a player to swap hands with.",
      targets.map((target) => ({
        label: target.name,
        action: () => resolveSwitch(cardId, target.id)
      }))
    );
    return;
  }

  await commitPlayedCard(cardId);
}

async function chooseDiscardTarget(targetCardId) {
  const game = latestGame;
  const pending = game?.pending;
  if (pending?.type !== "discardTarget" || pending.playerId !== localPlayerId) return;

  await runTransaction(roomRef(currentRoomCode), (current) => {
    if (!isCurrentTurnGame(current)) return current;
    const player = current.players[localPlayerId];
    const discardCard = (player.hand || []).find((card) => card.id === pending.cardId);
    if (!discardCard) return current;
    const remainingMiddle = (current.middle || []).filter((card) => card.id !== targetCardId);
    if (sumCards([...remainingMiddle, discardCard]) > CONFIG.middleLimit) return current;
    player.hand = player.hand.filter((card) => card.id !== pending.cardId);
    current.middle = applyFlushes([...remainingMiddle, discardCard]);
    current.pending = null;
    finishAfterPlay(current, player, `${player.name} discarded a middle card.`);
    return current;
  });
}

async function commitPlayedCard(cardId, message = null) {
  await runTransaction(roomRef(currentRoomCode), (game) => {
    if (!isCurrentTurnGame(game)) return game;
    const player = game.players[localPlayerId];
    const card = (player.hand || []).find((item) => item.id === cardId);
    if (!card || !canPlayCard(game, card)) return game;
    player.hand = player.hand.filter((item) => item.id !== cardId);
    game.middle = applyFlushes([...(game.middle || []), card]);
    finishAfterPlay(
      game,
      player,
      message ||
        `${player.name} played ${card.type === "normal" ? card.value : CONFIG.specialTypes[card.type].label}.`
    );
    return game;
  });
}

/**
 * Called after a card has been played / resolved.
 *
 * Clutch rule:
 *  - If the player is at or below 21, their turn ends normally.
 *  - If they are above 21, they are marked over21Pending.
 *    * If it is already their clutch turn, they must keep playing until they
 *      are back at 21 or less. If they run out of legal plays, they bust.
 *    * If it was a normal turn, the turn passes; they will clutch on their
 *      next turn instead of losing immediately.
 */
function finishAfterPlay(game, player, message) {
  const wasClutch = game.phase === "clutch" || player.over21Pending;
  const total = sumCards(player.hand || []);

  if (total <= CONFIG.handLimit) {
    player.over21Pending = false;
    Object.assign(game, nextTurnPatch(game, player.id, { message }));
    return;
  }

  // Still over 21.
  player.over21Pending = true;

  if (wasClutch) {
    // Keep the turn with this player if they still have legal plays.
    if (playableCards(game, player).length > 0) {
      game.phase = "clutch";
      game.activePlayerId = player.id;
      game.turnStartedAt = Date.now();
      game.turnForcedAddResolved = true;
      game.pending = null;
      game.message = `${player.name} is still over 21 — keep playing to clutch.`;
      return;
    }

    // No legal plays left: they bust.
    game.status = "gameOver";
    game.loserId = player.id;
    game.winnerId = null;
    game.message = `${player.name} could not clutch and busted.`;
    return;
  }

  // Normal turn that ended over 21: pass the turn, clutch next time.
  Object.assign(game, nextTurnPatch(game, player.id, { message }));
}

async function resolveTwoOne(cardId, mode) {
  hideChoice();
  await runTransaction(roomRef(currentRoomCode), (game) => {
    if (!isCurrentTurnGame(game)) return game;
    const player = game.players[localPlayerId];
    const card = (player.hand || []).find((item) => item.id === cardId);
    if (!card || card.type !== "twoOne" || !canPlayCard(game, card)) return game;
    player.hand = player.hand.filter((item) => item.id !== cardId);
    game.middle = applyFlushes([...(game.middle || []), card]);
    const drawCount = mode === "draw2Discard1" ? 2 : 1;
    const discardCount = mode === "draw2Discard1" ? 1 : 2;
    player.hand = [...player.hand, ...drawCards(drawCount)];
    game.pending = {
      type: "twoOneDiscard",
      playerId: localPlayerId,
      discardCount,
      selectedIds: []
    };
    game.message = `${player.name} must discard ${discardCount} card${discardCount === 1 ? "" : "s"}.`;
    return game;
  });
}

function promptTwoOneDiscards() {
  const game = latestGame;
  const pending = game?.pending;
  const player = game?.players?.[localPlayerId];
  if (pending?.type !== "twoOneDiscard" || !player) return;

  const actions = (player.hand || []).map((card) => ({
    label: `${cardLabel(card)} (${card.color})`,
    action: () => toggleTwoOneDiscard(card.id)
  }));
  showChoice(
    "Discard from hand",
    `Choose ${pending.discardCount} card${pending.discardCount === 1 ? "" : "s"} to discard.`,
    actions
  );
}

async function toggleTwoOneDiscard(cardId) {
  const before = latestGame?.pending;
  const selectedBefore = before?.selectedIds || [];
  const willComplete =
    before?.type === "twoOneDiscard" &&
    !selectedBefore.includes(cardId) &&
    selectedBefore.length + 1 >= before.discardCount;

  await runTransaction(roomRef(currentRoomCode), (game) => {
    const pending = game?.pending;
    if (pending?.type !== "twoOneDiscard" || pending.playerId !== localPlayerId) return game;
    pending.selectedIds = pending.selectedIds || [];
    if (pending.selectedIds.includes(cardId)) {
      pending.selectedIds = pending.selectedIds.filter((id) => id !== cardId);
    } else if (pending.selectedIds.length < pending.discardCount) {
      pending.selectedIds.push(cardId);
    }
    if (pending.selectedIds.length >= pending.discardCount) {
      const player = game.players[localPlayerId];
      const selected = new Set(pending.selectedIds);
      player.hand = (player.hand || []).filter((card) => !selected.has(card.id));
      game.pending = null;
      finishAfterPlay(game, player, `${player.name} resolved 2-1.`);
    }
    return game;
  });
  if (willComplete) hideChoice();
}

async function resolveSwitch(cardId, targetId) {
  hideChoice();
  await runTransaction(roomRef(currentRoomCode), (game) => {
    if (!isCurrentTurnGame(game)) return game;
    const player = game.players[localPlayerId];
    const target = game.players[targetId];
    const card = (player.hand || []).find((item) => item.id === cardId);
    if (!card || !target || !canPlayCard(game, card)) return game;
    player.hand = player.hand.filter((item) => item.id !== cardId);
    game.middle = applyFlushes([...(game.middle || []), card]);
    const oldHand = player.hand || [];
    player.hand = target.hand || [];
    target.hand = oldHand;
    finishAfterPlay(game, player, `${player.name} switched hands with ${target.name}.`);
    return game;
  });
}

async function loseGame(message) {
  await update(roomRef(currentRoomCode), {
    status: "gameOver",
    loserId: localPlayerId,
    winnerId: null,
    message
  });
}

function showChoice(title, text, actions) {
  resolvingChoice = true;
  els.choiceTitle.textContent = title;
  els.choiceText.textContent = text;
  els.choiceActions.innerHTML = "";
  actions.forEach((item) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = item.label;
    button.addEventListener("click", item.action);
    els.choiceActions.appendChild(button);
  });
  els.choiceModal.classList.remove("hidden");
}

function hideChoice() {
  resolvingChoice = false;
  els.choiceModal.classList.add("hidden");
}

function cardLabel(card) {
  return card.type === "normal" ? String(card.value) : CONFIG.specialTypes[card.type].label;
}

function isCurrentTurnGame(game) {
  return game?.status === "playing" && game.activePlayerId === localPlayerId && !game.gameOver;
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text || "";
  return div.innerHTML;
}

function leaveRoom() {
  if (unsubscribeRoom) unsubscribeRoom();
  unsubscribeRoom = null;
  currentRoomCode = "";
  latestGame = null;
  hideChoice();
  els.gameOver.classList.add("hidden");
  els.game.classList.add("hidden");
  els.lobby.classList.remove("hidden");
}

els.createRoomBtn.addEventListener("click", createRoom);
els.joinRoomBtn.addEventListener("click", joinRoom);
els.startBtn.addEventListener("click", startGame);
els.deckBtn.addEventListener("click", () => drawAction(false));
els.leaveBtn.addEventListener("click", leaveRoom);

window.addEventListener("beforeunload", () => {
  if (currentRoomCode && db) {
    update(playerRef(currentRoomCode, localPlayerId), { connected: false });
  }
});

boot();

</script>
  </body>
</html>
